name: Build and publish static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'brand/**'
      - 'optimized/**'
      - 'product-images/**'
      - 'robots.txt'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lakeside-static-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.current.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check all generated pages, catalogue, schema, assets and manifest
        run: python3 scripts/verify-static.py
      - name: Check selection business rules
        run: node scripts/test-selection.mjs
      - name: Check source is still current
        id: current
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "A newer source revision will be built by its own run."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Commit generated output
        if: steps.current.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build verified static site"
            git push origin HEAD:main
          fi
      - name: Package verified public files
        run: node scripts/package-static.mjs
      - uses: actions/upload-pages-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Coordinate with existing branch-based Pages publishing
        uses: actions/github-script@v7
        with:
          script: |
            // Existing repositories may still have Pages set to "Deploy from a branch".
            // Let those automatically triggered runs finish before publishing our
            // verified artifact, so the two publishers cannot cancel one another.
            const deadline = Date.now() + 15 * 60 * 1000;
            let quietChecks = 0;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, per_page: 30
              });
              const active = data.workflow_runs.filter(run =>
                run.id !== context.runId &&
                run.name === 'pages build and deployment' &&
                run.status !== 'completed'
              );
              quietChecks = active.length ? 0 : quietChecks + 1;
              if (quietChecks >= 2) return;
              core.info(active.length
                ? `Waiting for ${active.length} branch-based Pages run(s).`
                : 'Confirming the Pages publisher is idle.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Branch-based Pages publishing did not become idle within 15 minutes.');
      - name: Deploy the verified build
        id: deployment
        uses: actions/deploy-pages@v4
