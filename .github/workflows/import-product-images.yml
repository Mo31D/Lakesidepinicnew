name: Import product images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-product-images.mjs'
      - '.github/workflows/import-product-images.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/fetch-product-images.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Commit local product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-images/drinks-snacks src/catalogue.json drinks.html menu.html sitemap.xml
          git add -A
          git commit -m "Store Drinks + Snacks images locally" || exit 0
          git push
